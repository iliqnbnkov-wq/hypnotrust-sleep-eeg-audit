name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    # Non-blocking: the pinned set currently has known advisories (see
    # docs/reproducibility.md). Remove once the pins are reviewed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: pip-audit on pinned requirements
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: detect-secrets on tracked files
        run: |
          python -m pip install detect-secrets
          detect-secrets scan --all-files > /tmp/secrets.json
          python - <<'PY'
          import json, sys
          found = json.load(open("/tmp/secrets.json"))["results"]
          if found:
              # Print file names only, never the matched values.
              print("Potential secrets in:", sorted(found))
              sys.exit(1)
          print("No potential secrets detected.")
          PY
